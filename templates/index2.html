
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML Source Code</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0b1120;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
        }

        .back-btn {
            background: #0284c7;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .code-box {
            background: #080e19;
            border: 1px solid #263449;
            border-radius: 12px;
            overflow: auto;
            padding: 22px;
        }

        pre {
            margin: 0;
            color: #4ade80;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre;
            tab-size: 4;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="top">

        <div>
            <h1>HTML Source Code</h1>

            <p>
                Actual source code from index.html
            </p>
        </div>

        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>


    <div class="code-box">

        <pre><code>{{ source_code }}</code></pre>

    </div>

</div>

</body>
</html>
